<svg fill="none" viewBox="0 0 1200 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 500;
    }

    /* Ambient Pulsing Glow */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    .ambient-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .ambient-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite alternate 1.5s;
      transform-origin: 1000px 260px;
    }

    /* Floating Badges */
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1deg); }
    }
    @keyframes floatSlow3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .pill-floating-1 { animation: floatSlow1 5.5s ease-in-out infinite; }
    .pill-floating-2 { animation: floatSlow2 6.5s ease-in-out infinite 0.8s; }
    .pill-floating-3 { animation: floatSlow3 6s ease-in-out infinite 1.2s; }

    /* Animated Pipeline Flow Line */
    @keyframes flowDash {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .animated-pipeline-path {
      stroke-dasharray: 12 8;
      animation: flowDash 14s linear infinite;
    }

    /* Subtle Radar / Ping effect */
    @keyframes radarWave {
      0% { r: 6px; opacity: 1; stroke-width: 2px; }
      100% { r: 24px; opacity: 0; stroke-width: 0.5px; }
    }
    .ping-circle {
      animation: radarWave 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs (Background layer) -->
  <circle class="ambient-orb-1" cx="180" cy="100" r="130" fill="#38bdf8" filter="url(#glow)" opacity="0.3" />
  <circle class="ambient-orb-2" cx="1020" cy="240" r="150" fill="#6366f1" filter="url(#glow)" opacity="0.3" />
  <circle cx="600" cy="180" r="90" fill="#a855f7" filter="url(#glow)" opacity="0.15" />

  <!-- Background Decorative Geometric Lines / Flow -->
  <g opacity="0.4">
    <path class="animated-pipeline-path" d="M 50 80 Q 300 20 600 80 T 1150 70" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="animated-pipeline-path" d="M 50 300 Q 350 340 650 290 T 1150 280" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Background Status Pills / Flow Indicators (Behind text plane) -->
  <g class="pill-floating-1" transform="translate(80, 260)">
    <rect width="150" height="36" rx="18" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <circle class="ping-circle" cx="20" cy="18" r="6" fill="none" stroke="#38bdf8" />
    <text x="34" y="22" fill="#e2e8f0" class="tag-text">playwright test</text>
  </g>

  <g class="pill-floating-2" transform="translate(970, 70)">
    <rect width="160" height="36" rx="18" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#10b981" />
    <circle class="ping-circle" cx="20" cy="18" r="6" fill="none" stroke="#10b981" />
    <text x="34" y="22" fill="#e2e8f0" class="tag-text">cypress run --e2e</text>
  </g>

  <g class="pill-floating-3" transform="translate(980, 260)">
    <rect width="150" height="36" rx="18" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#818cf8" />
    <text x="34" y="22" fill="#e2e8f0" class="tag-text">selenium-grid</text>
  </g>

  <g class="pill-floating-1" transform="translate(70, 60)">
    <rect width="155" height="36" rx="18" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#ec4899" />
    <text x="34" y="22" fill="#e2e8f0" class="tag-text">ci/cd matrix: 200x</text>
  </g>

  <!-- Inner Frame Accent -->
  <rect x="20" y="20" width="1160" height="320" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Center Content: Title, Subtitle, Feature Badges (Always in Foreground) -->
  <g transform="translate(600, 105)" text-anchor="middle">
    <!-- Top Pill / Super-title -->
    <rect x="-170" y="-45" width="340" height="28" rx="14" fill="#1e293b" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="-145" cy="-31" r="4" fill="#38bdf8" />
    <text x="8" y="-31" fill="#38bdf8" class="badge-text" text-anchor="middle">AUTOMATED SCRIPT EXECUTION &amp; QA RUNNERS</text>

    <!-- Main Title -->
    <text y="30" class="title-text">
      <tspan fill="#ffffff">Awesome </tspan>
      <tspan fill="url(#primaryGrad)">Test Automation</tspan>
      <tspan fill="#ffffff"> &amp; Script Execution</tspan>
    </text>

    <!-- Subtitle -->
    <text y="75" class="subtitle-text">
      Curated ecosystem of next-gen cloud testing grids, E2E browser automation engines &amp; CI/CD runners
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 130)">
      <!-- Tag 1: Web & E2E -->
      <g transform="translate(-250, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#e2e8f0" class="tag-text" text-anchor="middle">🌐 Web E2E</text>
      </g>
      <!-- Tag 2: Mobile QA -->
      <g transform="translate(-120, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#e2e8f0" class="tag-text" text-anchor="middle">📱 Mobile QA</text>
      </g>
      <!-- Tag 3: API & Contract -->
      <g transform="translate(10, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#e2e8f0" class="tag-text" text-anchor="middle">⚡ API Testing</text>
      </g>
      <!-- Tag 4: Cloud Device Grids -->
      <g transform="translate(150, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#e2e8f0" class="tag-text" text-anchor="middle">☁️ Cloud Grids</text>
      </g>
      <!-- Tag 5: High-speed Parallel -->
      <g transform="translate(290, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text y="5" fill="#e2e8f0" class="tag-text" text-anchor="middle">🚀 Parallel CI</text>
      </g>
    </g>
  </g>
</svg>
