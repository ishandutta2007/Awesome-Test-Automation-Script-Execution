<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" fill="none" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.08)"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatSlow1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes floatSlow2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(12px) rotate(-1deg)}}@keyframes floatSlow3{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes flowDash{0%{stroke-dashoffset:400}}@keyframes radarWave{0%{r:6px;opacity:1;stroke-width:2px}}.title-text{font-weight:800;font-size:46px;letter-spacing:-.5px}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;font-size:18px;fill:#94a3b8}.badge-text{font-size:13px;font-weight:600}.tag-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;font-weight:500}.ambient-orb-1{animation:pulseGlow 7s ease-in-out infinite alternate;transform-origin:200px 100px}.ambient-orb-2{animation:pulseGlow 9s ease-in-out infinite alternate 1.5s;transform-origin:1000px 260px}.pill-floating-1{animation:floatSlow1 5.5s ease-in-out infinite}.pill-floating-2{animation:floatSlow2 6.5s ease-in-out infinite .8s}.pill-floating-3{animation:floatSlow3 6s ease-in-out infinite 1.2s}.animated-pipeline-path{stroke-dasharray:12 8;animation:flowDash 14s linear infinite}.ping-circle{animation:radarWave 2.5s cubic-bezier(0,.2,.8,1) infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><circle cx="180" cy="100" r="130" fill="#38bdf8" class="ambient-orb-1" filter="url(#glow)" opacity=".3"/><circle cx="1020" cy="240" r="150" fill="#6366f1" class="ambient-orb-2" filter="url(#glow)" opacity=".3"/><circle cx="600" cy="180" r="90" fill="#a855f7" filter="url(#glow)" opacity=".15"/><g opacity=".4"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 50 80 Q 300 20 600 80 T 1150 70" class="animated-pipeline-path"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 50 300 Q 350 340 650 290 T 1150 280" class="animated-pipeline-path"/></g><g class="pill-floating-1" transform="translate(80, 260)"><rect width="150" height="36" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="4" fill="#38bdf8"/><circle cx="20" cy="18" r="6" fill="none" stroke="#38bdf8" class="ping-circle"/><text x="34" y="22" fill="#e2e8f0" class="tag-text">playwright test</text></g><g class="pill-floating-2" transform="translate(970, 70)"><rect width="160" height="36" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity=".4" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="4" fill="#10b981"/><circle cx="20" cy="18" r="6" fill="none" stroke="#10b981" class="ping-circle"/><text x="34" y="22" fill="#e2e8f0" class="tag-text">cypress run --e2e</text></g><g class="pill-floating-3" transform="translate(980, 260)"><rect width="150" height="36" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".4" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="4" fill="#818cf8"/><text x="34" y="22" fill="#e2e8f0" class="tag-text">selenium-grid</text></g><g class="pill-floating-1" transform="translate(70, 60)"><rect width="155" height="36" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".4" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="4" fill="#ec4899"/><text x="34" y="22" fill="#e2e8f0" class="tag-text">ci/cd matrix: 200x</text></g><rect width="1160" height="320" x="20" y="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="12"/><g text-anchor="middle" transform="translate(600, 105)"><rect width="340" height="28" x="-170" y="-45" fill="#1e293b" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="14"/><circle cx="-145" cy="-31" r="4" fill="#38bdf8"/><text x="8" y="-31" fill="#38bdf8" class="badge-text" text-anchor="middle">AUTOMATED SCRIPT EXECUTION &amp; QA RUNNERS</text><text y="30" class="title-text"><tspan fill="#fff">Awesome </tspan> <tspan fill="url(#primaryGrad)">Test Automation</tspan> <tspan fill="#fff"> &amp; Script Execution</tspan></text><text y="75" class="subtitle-text">Curated ecosystem of next-gen cloud testing grids, E2E browser automation engines &amp; CI/CD runners</text><g><g transform="translate(0, 130) translate(-250, 0)"><rect width="110" height="28" x="-55" y="-14" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text y="5" fill="#e2e8f0" class="tag-text" text-anchor="middle">🌐 Web E2E</text></g><g transform="translate(0, 130) translate(-120, 0)"><rect width="110" height="28" x="-55" y="-14" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text y="5" fill="#e2e8f0" class="tag-text" text-anchor="middle">📱 Mobile QA</text></g><g transform="translate(0, 130) translate(10, 0)"><rect width="120" height="28" x="-60" y="-14" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text y="5" fill="#e2e8f0" class="tag-text" text-anchor="middle">⚡ API Testing</text></g><g transform="translate(0, 130) translate(150, 0)"><rect width="130" height="28" x="-65" y="-14" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text y="5" fill="#e2e8f0" class="tag-text" text-anchor="middle">☁️ Cloud Grids</text></g><g transform="translate(0, 130) translate(290, 0)"><rect width="120" height="28" x="-60" y="-14" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text y="5" fill="#e2e8f0" class="tag-text" text-anchor="middle">🚀 Parallel CI</text></g></g></g></svg>